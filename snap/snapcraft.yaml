name: lain
version: 4.5.1
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-lain: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.lain # adjust accordingly to your app name

apps:
  lain:
    command: lain
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-lain
parts:
  lain:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
