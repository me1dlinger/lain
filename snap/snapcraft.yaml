name: sylvakru
version: 4.5.1
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-sylvakru: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.sylvakru # adjust accordingly to your app name

apps:
  sylvakru:
    command: sylvakru
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-sylvakru
parts:
  sylvakru:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
